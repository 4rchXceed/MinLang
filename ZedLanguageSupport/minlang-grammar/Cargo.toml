[package]
name = "tree-sitter-minlang"
description = "Language Server for https://4rchxceed.github.io/MinLang-docs"
version = "1.0.0"
authors = ["Lyam Zambaz <lyam.zambaz@pm.me>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "minlang"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/4rchxceed/minlang.git"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.9"
